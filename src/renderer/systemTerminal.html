<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Comfy Desktop — Terminal</title>
    <!--
      The system terminal runs in a transparent WebContentsView over the host
      window's body. It only needs its bundled JS/CSS and fonts; shell I/O goes
      over IPC, never the network.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/systemTerminal/main.ts"></script>
  </body>
</html>
