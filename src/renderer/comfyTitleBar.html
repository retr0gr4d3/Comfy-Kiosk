<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Comfy Desktop — Title Bar</title>
    <!--
      The title bar is the always-alive renderer per host window. CSP stays
      narrow — only the bundled JS, design-token CSS, and Inter font are
      needed.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/comfyTitleBar/main.ts"></script>
  </body>
</html>
