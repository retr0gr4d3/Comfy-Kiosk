name: Release .deb

# Builds the Linux .deb and publishes it as a GitHub release.
#
#   - Push a tag `v<version>` (or `v<version>-<suffix>` for a prerelease) that
#     points at a commit on main, where <version> is package.json's version.
#   - Or run it by hand (Actions → Release .deb → Run workflow) on main with a
#     tag name; the tag is created on the checked-out commit.
#
# Re-running for an existing release replaces its assets.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v1.1.2 (must match package.json's version)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-deb-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  deb:
    name: Build and publish .deb
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check the tag
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          case "$TAG" in
            "v$version"|"v$version"-*) ;;
            *)
              echo "::error::Tag $TAG does not match package.json version $version (expected v$version or v$version-<suffix>)."
              exit 1
              ;;
          esac
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_SHA is not on main; releases are cut from main only."
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then echo "PRERELEASE=true" >> "$GITHUB_ENV"; fi

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      # The postinstall step (electron-builder install-app-deps) compiles
      # node-pty against Electron; the terminal needs it.
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch bundled Python
        run: node scripts/fetch-bootstrap-python.mjs --platform linux-x64

      - name: Build app
        run: pnpm run build

      - name: Package .deb
        run: pnpm exec electron-builder --linux deb --x64 --publish never

      - name: Verify package
        run: |
          set -euo pipefail
          deb="$(ls dist/*.deb)"
          dpkg-deb -I "$deb"
          # List to a file first: piping into `grep -q` makes dpkg-deb's tar
          # die of SIGPIPE on the first match, which pipefail reports as a miss.
          listing="$(mktemp)"
          dpkg-deb -c "$deb" > "$listing"
          # Without the Linux node-pty binary the Ctrl+Alt+T terminal is dead.
          grep -q 'node-pty/build/Release/pty.node' "$listing" \
            || { echo "::error::node-pty's Linux binary is missing from $deb"; exit 1; }
          grep -q 'resources/bootstrap-python/bin/python3' "$listing" \
            || { echo "::error::bundled Python is missing from $deb"; exit 1; }
          (cd dist && sha256sum "$(basename "$deb")" > "$(basename "$deb").sha256")

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          assets=(dist/*.deb dist/*.deb.sha256)
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            notes="$(printf '%s\n\n%s\n%s\n' \
              'Linux (x64) .deb build of True Comfy Desktop.' \
              'Install: `sudo apt install ./'"$(basename dist/*.deb)"'`' \
              'Run in a kiosk: `cage -- "/opt/Comfy Desktop/comfyui-desktop-2"`')"
            gh release create "$TAG" "${assets[@]}" \
              --target "$GITHUB_SHA" \
              --title "True Comfy Desktop $TAG" \
              --notes "$notes" \
              --generate-notes \
              ${PRERELEASE:+--prerelease}
          fi
